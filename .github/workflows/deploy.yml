# Deploy over SSH: if you see "handshake failed: unable to authenticate, attempted methods [none publickey]"
# 1. SSH_PRIVATE_KEY: Paste the *entire* PEM (including -----BEGIN ... KEY----- and -----END ... KEY-----)
#    with real line breaks. If you stored it as one line with \n, the workflow will try to fix it.
# 2. On the server: ensure the matching *public* key is in ~/.ssh/authorized_keys for SSH_USER.
# 3. If the key has a passphrase, add secret SSH_PASSPHRASE and passphrase: ${{ secrets.SSH_PASSPHRASE }} to the action.
name: Deploy Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Docker Build & Publish"]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment:
      name: production

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for key in SSH_HOST SSH_USER SSH_PRIVATE_KEY GHCR_USERNAME GHCR_TOKEN APP_DIR IMAGE_PREFIX; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_DIR: ${{ secrets.APP_DIR }}
          IMAGE_PREFIX: ${{ secrets.IMAGE_PREFIX }}

      # Restore newlines if SSH key was stored with literal \n (common when pasting into GitHub Secrets)
      - name: Prepare SSH key
        shell: bash
        run: |
          KEY="$SSH_PRIVATE_KEY"
          # If secret contains literal \n, convert to real newlines
          if [[ "$KEY" == *'\n'* ]]; then
            KEY="${KEY//\\n/$'\n'}"
          fi
          # Sanity check: key must have BEGIN and END lines (content is masked in logs)
          if ! printf '%s' "$KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "::error::SSH key missing 'BEGIN OPENSSH PRIVATE KEY'. Paste the full key including header/footer."
            exit 1
          fi
          if ! printf '%s' "$KEY" | grep -q "END OPENSSH PRIVATE KEY"; then
            echo "::error::SSH key missing 'END OPENSSH PRIVATE KEY'. Paste the full key including header/footer."
            exit 1
          fi
          echo "SSH_KEY<<EOF" >> $GITHUB_ENV
          printf '%s' "$KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_DIR: ${{ secrets.APP_DIR }}
          IMAGE_PREFIX: ${{ secrets.IMAGE_PREFIX }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,APP_DIR,IMAGE_PREFIX
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            cd "$APP_DIR"

            if [ ! -f docker-compose.prod.yml ]; then
              echo "docker-compose.prod.yml not found in $APP_DIR"
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export IMAGE_PREFIX="$IMAGE_PREFIX"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f
            echo "Deployment complete"
