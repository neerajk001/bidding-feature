name: Deploy Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Docker Build & Publish"]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          IMAGE_PREFIX: ${{ secrets.IMAGE_PREFIX }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -e
          mkdir -p ~/.ssh
          key="$SSH_PRIVATE_KEY"
          [[ "$key" == *'\n'* ]] && key="${key//\\n/$'\n'}"
          printf '%s\n' "$key" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          APP_DIR="$(printf '%s' "$APP_DIR" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          IMAGE_PREFIX="$(printf '%s' "$IMAGE_PREFIX" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "set -e
          export APP_DIR='$APP_DIR'
          export IMAGE_PREFIX='$IMAGE_PREFIX'
          export GHCR_USERNAME='$GHCR_USERNAME'
          export GHCR_TOKEN='$GHCR_TOKEN'
          export DOCKER_CLIENT_TIMEOUT=300
          export COMPOSE_HTTP_TIMEOUT=300

          retry() {
            attempt=1
            max_attempts=5
            delay=10
            while true; do
              \"\$@\" && break
              if [ \"\$attempt\" -ge \"\$max_attempts\" ]; then
                echo \"Command failed after \$attempt attempts: \$*\"
                return 1
              fi
              echo \"Attempt \$attempt failed. Retrying in \${delay}s...\"
              sleep \"\$delay\"
              attempt=\$((attempt + 1))
              delay=\$((delay + 10))
            done
          }

          cd \"\$APP_DIR\"
          [ -f docker-compose.prod.yml ] || { echo docker-compose.prod.yml not found; exit 1; }
          retry bash -lc 'echo "\$GHCR_TOKEN" | docker login ghcr.io -u "\$GHCR_USERNAME" --password-stdin'
          docker compose -f docker-compose.prod.yml down || true
          retry docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          echo Deployment complete"
