name: Deploy Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Docker Build & Publish"]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment: production

    steps:
      - name: Prepare SSH key
        run: |
          key="${{ secrets.SSH_PRIVATE_KEY }}"
          [[ "$key" == *'\n'* ]] && key="${key//\\n/$'\n'}"
          # Use a unique delimiter so key content can't contain it (avoids "Matching delimiter not found 'EOF'")
          echo "SSH_KEY<<DEPLOY_SSH_KEY_END" >> $GITHUB_ENV
          printf '%s' "$key" >> $GITHUB_ENV
          echo "DEPLOY_SSH_KEY_END" >> $GITHUB_ENV
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,APP_DIR,IMAGE_PREFIX
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            APP_DIR="$(printf '%s' "$APP_DIR" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            cd "$APP_DIR"
            [ -f docker-compose.prod.yml ] || { echo "docker-compose.prod.yml not found in $APP_DIR"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export IMAGE_PREFIX="$(printf '%s' "$IMAGE_PREFIX" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "Deployment complete"
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_DIR: ${{ secrets.APP_DIR }}
          IMAGE_PREFIX: ${{ secrets.IMAGE_PREFIX }}
