name: Deploy Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Docker Build & Publish"]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment:
      name: production

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for key in SSH_HOST SSH_USER SSH_PRIVATE_KEY GHCR_USERNAME GHCR_TOKEN APP_DIR IMAGE_PREFIX; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_DIR: ${{ secrets.APP_DIR }}
          IMAGE_PREFIX: ${{ secrets.IMAGE_PREFIX }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_DIR: ${{ secrets.APP_DIR }}
          IMAGE_PREFIX: ${{ secrets.IMAGE_PREFIX }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,APP_DIR,IMAGE_PREFIX
          script_stop: true
          script: |
            set -e
            cd "$APP_DIR"

            if [ ! -f docker-compose.prod.yml ]; then
              echo "docker-compose.prod.yml not found in $APP_DIR"
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export IMAGE_PREFIX="$IMAGE_PREFIX"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f
            echo "Deployment complete"
